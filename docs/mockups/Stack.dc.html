<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stack panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#D4A94F}a:hover{color:#E8C27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #15171B; font-family: 'Source Sans 3', system-ui, sans-serif; color: #ECE7DC">

<div style="position: absolute; left: 0; top: 96px; width: 390px; height: 748px; overflow: hidden">
<div style="position: absolute; left: 0; top: -320px; width: 390px; height: 756px">
<dc-import name="MapTerrain" hint-size="390px,756px"></dc-import>
<svg width="390" height="756" viewBox="0 0 390 756" style="position: absolute; left: 0; top: 0" role="img" aria-label="Borin's Host selected on the road south of the bridge">
<g transform="translate(194.9 430.5)">
<circle r="21" fill="none" stroke="#F2C55C" stroke-width="3"/>
<rect x="-13" y="-13" width="26" height="26" rx="6" fill="#5B9BE6" stroke="#121317" stroke-width="2"/>
<text y="4.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0E1622">5</text>
<g transform="translate(12 -12)">
<circle r="6.5" fill="#D4A94F" stroke="#121317" stroke-width="1.5"/>
<path d="M0 -3.6l1.1 2.2 2.4 .3-1.8 1.6 .5 2.4L0 1.7l-2.2 1.2 .5-2.4-1.8-1.6 2.4-.3z" fill="#121317"/>
</g>
</g>
<g transform="translate(259.8 468)">
<rect x="-13" y="-13" width="26" height="26" rx="6" fill="#5B9BE6" stroke="#121317" stroke-width="2"/>
<text y="4.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0E1622">3</text>
</g>
</svg>
</div>
</div>

<header style="position: absolute; left: 0; top: 0; width: 390px; height: 96px; box-sizing: border-box; padding: 4px 8px 0 16px; background: #15171B; border-bottom: 1px solid #2C3038; display: flex; flex-direction: column">
<div style="height: 52px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#D4A94F" stroke="#8A6A2A" stroke-width="1.5"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="#8A6A2A" stroke-width="1.5"/></svg>
<span style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums">212</span>
<span style="font-size: 14px; font-weight: 600; color: #6CC28A">+18 per turn</span>
</div>
<div style="display: flex; align-items: baseline; gap: 4px">
<span style="font-family: Cinzel, serif; font-size: 15px; font-weight: 700; letter-spacing: 0.04em">Turn 14</span>
<span style="font-size: 13px; color: #B3AC9F">of 40</span>
</div>
<div style="display: flex; gap: 2px">
<button aria-label="Map overlays" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ECE7DC" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
<button aria-label="Menu" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ECE7DC" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>
</div>
<div style="padding-right: 8px; display: flex; flex-direction: column; gap: 6px">
<div style="position: relative; height: 8px">
<div style="height: 8px; border-radius: 4px; overflow: hidden; display: flex; gap: 1px; background: #2C3038">
<div style="width: 25%; background: #5B9BE6"></div>
<div style="width: 33.3%; background: #E8873F"></div>
<div style="width: 19.4%; background: #B48CE0"></div>
<div style="width: 16.7%; background: #7FBF6A"></div>
</div>
<div style="position: absolute; left: 50%; top: -4px; width: 2px; height: 16px; background: #FFF8EA; border-radius: 1px"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #B3AC9F">
<span>You 45 · Orcs 60 · Horse 35 · Elves 30</span>
<span>Win at 90</span>
</div>
</div>
</header>

<section aria-label="Stack details" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 576px; box-sizing: border-box; padding: 10px 16px 16px; background: #1E2127; border-radius: 16px 16px 0 0; box-shadow: 0 -6px 20px rgba(0,0,0,0.35); display: flex; flex-direction: column; gap: 12px">
<div style="width: 36px; height: 4px; border-radius: 2px; background: #3A404B; align-self: center"></div>
<div style="display: flex; align-items: center; gap: 12px">
<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="6" fill="#5B9BE6" stroke="#121317" stroke-width="2"/><text x="16" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#0E1622" font-family="Source Sans 3, sans-serif">5</text></svg>
<div style="flex: 1; display: flex; flex-direction: column">
<span style="font-family: Cinzel, serif; font-size: 17px; font-weight: 700">Borin's Host</span>
<span style="font-size: 13px; color: #B3AC9F">5 of 8 units · Move 6 · Leadership +25%</span>
</div>
<button aria-label="Close stack panel" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3AC9F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div style="display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #B3AC9F; padding-bottom: 4px">
<span>Fight order, weakest first</span>
<span>Battle strength · hits</span>
</div>

<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #2C3038">
<input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #D4A94F">
<span style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 600">Siege engine</span>
<span style="font-size: 13px; color: #B3AC9F">Str 2 · Move 6 · walls −25%</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">2.5</span>
<span style="display: flex; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #ECE7DC"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #ECE7DC"></span></span>
</span>
</label>

<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #2C3038">
<input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: #D4A94F">
<span style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 600">Infantry</span>
<span style="font-size: 13px; color: #B3AC9F">Str 4 · Move 8</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">5</span>
<span style="display: flex; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #ECE7DC"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #ECE7DC"></span></span>
</span>
</label>

<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #2C3038">
<input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: #D4A94F">
<span style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 600">Infantry</span>
<span style="font-size: 13px; color: #EE7466">Wounded · heals 1 hit when resting</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">5</span>
<span style="display: flex; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #ECE7DC"></span><span style="width: 8px; height: 8px; border-radius: 4px; box-sizing: border-box; border: 1.5px solid #7D818A"></span></span>
</span>
</label>

<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #2C3038">
<input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #D4A94F">
<span style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 600">Ironguard</span>
<span style="font-size: 13px; color: #B3AC9F">Str 5 · Move 6 · dwarf elite</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">6.25</span>
<span style="display: flex; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #ECE7DC"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #ECE7DC"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #ECE7DC"></span></span>
</span>
</label>

<label style="display: flex; align-items: center; gap: 12px; min-height: 52px">
<input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #D4A94F">
<span style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px">Thane Borin <span style="font-size: 11px; font-weight: 700; color: #1A1508; background: #D4A94F; border-radius: 4px; padding: 1px 5px">HERO · LV 1</span></span>
<span style="font-size: 13px; color: #B3AC9F">Str 5 · Move 10 · leads the stack</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">6.25</span>
<span style="display: flex; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #ECE7DC"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #ECE7DC"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #ECE7DC"></span></span>
</span>
</label>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #B3AC9F">If attacked</span>
<div role="group" aria-label="Stance if attacked" style="display: flex; background: #15171B; border-radius: 12px; padding: 3px; gap: 3px">
<button aria-pressed="true" style="flex: 1; height: 42px; border: none; border-radius: 9px; background: #D4A94F; color: #1A1508; font-size: 15px; font-weight: 700">Hold</button>
<button aria-pressed="false" style="flex: 1; height: 42px; border: none; border-radius: 9px; background: transparent; color: #ECE7DC; font-size: 15px; font-weight: 600">Fall back</button>
<button aria-pressed="false" style="flex: 1; height: 42px; border: none; border-radius: 9px; background: transparent; color: #ECE7DC; font-size: 15px; font-weight: 600">Evade</button>
</div>
<span style="font-size: 13px; color: #B3AC9F">Hold: fight to the last unit.</span>
</div>

<div style="display: flex; gap: 10px; margin-top: auto">
<button style="flex: 1; height: 48px; border-radius: 12px; background: #272B33; color: #ECE7DC; border: 1px solid #3A404B; font-size: 16px; font-weight: 600">Sentry</button>
<button style="flex: 2; height: 48px; border-radius: 12px; background: #D4A94F; color: #1A1508; border: none; font-size: 16px; font-weight: 700">Split 2 off</button>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
